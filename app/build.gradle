plugins { id 'com.android.application' }

def signingFile = rootProject.file('release-signing/signing.properties')
def releaseSigning = new Properties()
if (signingFile.isFile()) {
    signingFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace 'cn.archeo.offtime'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.archeo.offtime'
        minSdk 28
        targetSdk 34
        versionCode 6
        versionName '1.3.1'
    }
    signingConfigs {
        release {
            if (signingFile.isFile()) {
                storeFile rootProject.file('release-signing/offtime-release.jks')
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
